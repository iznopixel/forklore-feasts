name: Keep Supabase awake

# Vercel's free cron only runs once a day, so this adds more frequent pings.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the heartbeat route
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 https://forklore-feasts.vercel.app/api/keep-alive
